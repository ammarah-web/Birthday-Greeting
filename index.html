<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 22px;
      display: grid; place-items: center;
      background: radial-gradient(circle at top, #49301d, #100d0c 65%);
      font-family: Georgia, serif;
    }
    .wrap { width: min(100%, 520px); text-align: center; }
    img {
      display: block; width: 100%; height: auto; max-height: 92vh;
      object-fit: contain; border: 2px solid #d8ad72;
      border-radius: 10px; box-shadow: 0 12px 45px #0009;
    }
    .note { color: #f2d5ad; margin: 14px 0 0; font-size: 14px; letter-spacing: .5px; }
  </style>
</head>
<body>
  <main class="wrap">
    <img src="birthday-card.png" alt="A black and golden Happy Birthday card">
  </main>
</body>
</html>
